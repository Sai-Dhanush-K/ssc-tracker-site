<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SSC Syllabus & Mock Tracker | Neo‑brutalist</title>
  <!-- Google Fonts for playful handwritten & bold look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --ink:#1e1e1e;
      --paper:#fbfbf7;
      --card:#ffffff;
      --purple:#6965db;
      --purple-ring:#edecfc;
      --coral:#ff6b6b;
      --coral-dark:#e8590c;
      --c-red:#e03131;
      --c-orange:#f08c00;
      --c-yellow:#ffd43b;
      --c-lgreen:#82c91e;
      --c-green:#2f9e44;
      --sh-sm:3px 3px 0 var(--ink);
      --sh-md:5px 5px 0 var(--ink);
      --sh-lg:8px 8px 0 var(--ink);
      --r-sm:10px;
      --r-md:16px;
      --r-lg:22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--paper);
      background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 1.25rem;
      color: var(--ink);
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    button:focus-visible, [tabindex]:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid var(--purple);
      outline-offset: 2px;
    }

    .app-shell {
      max-width: 1220px;
      margin: 0 auto;
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .app-title {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: clamp(2.1rem, 4vw, 3rem);
      line-height: 1;
      transform: rotate(-1deg);
      display: inline-block;
      text-shadow: 4px 4px 0 var(--c-yellow);
    }

    .title-subtle {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.4rem 0.8rem;
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: var(--r-sm);
      box-shadow: var(--sh-sm);
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Neo-brutalist base card: presses toward its own shadow on hover,
       signalling "content", as opposed to buttons which lift. */
    .nb-card {
      background: var(--card);
      border-radius: var(--r-md);
      border: 3px solid var(--ink);
      box-shadow: var(--sh-md);
      padding: 1.15rem;
      transition: box-shadow .12s ease, transform .12s ease;
      margin-bottom: 1.1rem;
    }
    .nb-card:hover {
      box-shadow: var(--sh-sm);
      transform: translate(2px, 2px);
    }

    button, .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: var(--r-sm);
      box-shadow: var(--sh-sm);
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--ink);
      letter-spacing: 0.1px;
      transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    button:hover, .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--sh-md);
    }
    button:active, .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    button#addMockBtn, button.primary {
      background: var(--purple);
      color: #fff;
    }

    select, input, textarea {
      font-family: 'Plus Jakarta Sans', sans-serif;
      border: 2.5px solid var(--ink);
      border-radius: var(--r-sm);
      box-shadow: var(--sh-sm);
      padding: 0.5rem 0.6rem;
      font-size: 0.95rem;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .section-heading {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: 1.5rem;
      margin: 2rem 0 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* navigation tabs */
    .tabs {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      background: var(--card);
      font-size: 1.2rem;
      padding: 0.55rem 1.8rem;
      border-radius: var(--r-sm) var(--r-sm) 4px 4px;
      box-shadow: var(--sh-sm);
    }
    .tab-btn.active {
      background: var(--purple);
      color: #fff;
      box-shadow: var(--sh-md);
      transform: rotate(-1deg);
    }

    .corner-tools {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
    }

    .corner-toggle {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      border-radius: 999px;
    }

    .corner-popover {
      width: min(260px, calc(100vw - 2rem));
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: var(--r-md);
      box-shadow: var(--sh-lg);
      padding: 0.9rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.97);
      transform-origin: top right;
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
    }

    .corner-popover.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .corner-popover h3 {
      font-family: 'Kalam', cursive;
      margin-bottom: 0.75rem;
      font-size: 1.05rem;
    }

    .corner-popover .stack {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .corner-popover .stack button {
      width: 100%;
      justify-content: center;
    }

    /* Tree container */
    #tree-container {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .node-card {
      background: var(--card);
      border-radius: 4px var(--r-md) var(--r-md) 4px;
      border: 2.5px solid var(--ink);
      box-shadow: var(--sh-sm);
      padding: 0.6rem 0.9rem;
      margin-left: 1.4rem;
      transition: box-shadow .1s ease;
      position: relative;
    }
    .node-card.root-children {
      margin-left: 0;
      border-left: 10px solid var(--c-yellow);
      box-shadow: var(--sh-md);
    }
    .node-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .expand-btn {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 50%;
      box-shadow: var(--sh-sm);
      font-size: 1.05rem;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      color: var(--ink);
      transition: background .1s ease, transform .1s ease;
    }
    .expand-btn:hover {
      background: var(--purple-ring);
      transform: translate(-1px,-1px);
    }
    .node-name {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      text-decoration: none;
      transition: color .1s ease;
    }
    .node-name:hover {
      color: var(--purple);
    }
    .tier2-badge {
      background: var(--coral);
      color: white;
      font-weight: 700;
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      border: 2px solid var(--ink);
      border-radius: 0;
      box-shadow: var(--sh-sm);
      letter-spacing: 0.05em;
    }
    .node-children {
      margin-top: 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    /* confidence color left border classes */
    .conf-0 { border-left: 10px solid var(--c-red) !important; }
    .conf-1 { border-left: 10px solid var(--c-orange) !important; }
    .conf-2 { border-left: 10px solid var(--c-yellow) !important; }
    .conf-3 { border-left: 10px solid var(--c-lgreen) !important; }
    .conf-4 { border-left: 10px solid var(--c-green) !important; }

    /* modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30,30,30,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card);
      border: 4px solid var(--ink);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-lg);
      padding: 1.75rem;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }
    #modalNodeName {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: 1.35rem;
      margin-bottom: 0.9rem;
    }
    .modal-content p strong { font-size: 0.85rem; }
    .confidence-palette {
      display: flex;
      gap: 0.6rem;
      margin: 0.7rem 0 1.1rem;
    }
    .conf-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid var(--ink);
      box-shadow: var(--sh-sm);
      cursor: pointer;
      transition: transform .1s ease;
    }
    .conf-dot:hover { transform: scale(1.12); }

    /* mock page */
    .hidden-page {
      display: none;
    }
    .mock-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      align-items: end;
    }
    .mock-form-grid > div > label,
    .subject-marks > div > label {
      display: block;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
      opacity: 0.7;
    }
    .subject-marks {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 0.9rem 0;
    }
    .analytics-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      margin: 1rem 0;
      background: var(--card);
      padding: 0.85rem 1rem;
      border: 2.5px solid var(--ink);
      border-radius: var(--r-sm);
      box-shadow: var(--sh-sm);
    }
    .analytics-filters label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    canvas {
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: var(--r-sm);
      box-shadow: var(--sh-md);
      margin: 1rem 0;
      max-width: 100%;
    }
    .mock-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1rem 0;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: var(--r-md);
      box-shadow: var(--sh-md);
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    .mock-table th, .mock-table td {
      border-bottom: 2px solid var(--ink);
      border-right: 2px solid var(--ink);
      padding: 0.5rem 0.6rem;
      text-align: center;
      font-size: 0.82rem;
    }
    .mock-table th:last-child, .mock-table td:last-child { border-right: none; }
    .mock-table tr:last-child td { border-bottom: none; }
    .mock-table th {
      background: var(--ink);
      color: var(--paper);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .mock-table tr:nth-child(even) td {
      background: #f7f7fb;
    }
    .btn-small {
      font-size: 0.78rem;
      padding: 0.25rem 0.7rem;
    }
    .global-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    hr {
      border: none;
      border-top: 2.5px dashed var(--ink);
      margin: 1.5rem 0;
      opacity: 0.6;
    }

    .node-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .mini-btn {
      font-size: 0.72rem;
      padding: 0.25rem 0.4rem;
      box-shadow: var(--sh-sm);
      border-width: 2px;
      min-width: 30px;
      min-height: 30px;
      justify-content: center;
    }

    .mini-btn.danger {
      background: var(--coral);
      color: #fff;
    }

    .icon-only {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 0.95rem;
    }

    .node-icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="corner-tools">
      <button id="dataMenuBtn" class="corner-toggle">🗂 Data</button>
      <div id="dataMenu" class="corner-popover">
        <h3>Data Tools</h3>
        <div class="stack">
          <button id="exportAllBtn">💾 Export All Data</button>
          <button id="importAllBtn">📂 Import JSON</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;">
      </div>
    </div>

    <div class="app-header">
      <div>
        <h1 class="app-title">📚 SSC Prep Hub</h1>
        <div class="title-subtle">Track syllabus confidence, notes, and mock tests in one place.</div>
      </div>
    </div>

    <!-- Tab navigation -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="syllabus">🌳 Syllabus Tree</button>
      <button class="tab-btn" data-tab="mock">📊 Mock Tests & Analytics</button>
    </div>

    <!-- SYLLABUS PAGE -->
    <div id="syllabus-page">
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem;">
        <button id="showAllBtn">👁️ Show All Subjects</button>
        <span class="title-subtle">Click a subject or subtopic for notes, confidence, and actions.</span>
      </div>
      <div id="tree-container"></div>
    </div>

    <!-- MOCK TEST PAGE (hidden initially) -->
    <div id="mock-page" class="hidden-page">
      <h2 class="section-heading">📝 Log New Mock Test</h2>
      <div class="nb-card">
        <div class="mock-form-grid">
          <div>
            <label>Tier</label>
            <select id="mockTier"><option value="1" selected>Tier 1</option><option value="2">Tier 2</option></select>
          </div>
          <div>
            <label>Exam Level</label>
            <select id="mockExam"><option value="CGL">CGL</option><option value="CHSL">CHSL</option><option value="MTS">MTS</option></select>
          </div>
          <div>
            <label>Source</label>
            <input type="text" id="mockSource" placeholder="e.g., Testbook">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="mockDate">
          </div>
          <div>
            <label>Total Max Marks</label>
            <input type="number" id="mockTotalMax" value="200" min="1">
          </div>
          <div>
            <label>Total Obtained</label>
            <input type="number" id="mockTotalObt" value="0" min="0">
          </div>
        </div>
        <div class="subject-marks" id="subjectMarksContainer">
          <!-- dynamically filled based on tier -->
        </div>
        <button id="addMockBtn" style="margin-top:1rem;">➕ Add Mock Test</button>
      </div>

      <h2 class="section-heading">📋 Previous Mock Tests</h2>
      <div id="mockListContainer"></div>

      <h2 class="section-heading">📈 Analytics</h2>
      <div class="analytics-filters" id="analyticsFilters">
        <label>Tier: 
          <select id="analyticTier"><option value="1">Tier 1</option><option value="2">Tier 2</option></select>
        </label>
        <label><input type="checkbox" class="exam-check" value="CGL" checked> CGL</label>
        <label><input type="checkbox" class="exam-check" value="CHSL" checked> CHSL</label>
        <label><input type="checkbox" class="exam-check" value="MTS" checked> MTS</label>
        <button id="refreshAnalyticsBtn">🔄 Refresh Charts</button>
      </div>
      <div id="analyticsContainer">
        <canvas id="totalScoreChart" width="400" height="200"></canvas>
        <canvas id="subjectScoreChart" width="400" height="200"></canvas>
        <div id="statsContainer" class="nb-card"></div>
      </div>
    </div>
  </div>

  <!-- MODAL for syllabus node details -->
  <div class="modal-overlay" id="nodeModal">
    <div class="modal-content">
      <h3 id="modalNodeName"></h3>
      <p><strong>Confidence:</strong></p>
      <div class="confidence-palette" id="confidencePalette"></div>
      <label><strong>Notes:</strong></label>
      <textarea id="modalNotes" rows="4" placeholder="Add your notes here..."></textarea>
      <div style="margin-top:1rem; display: flex; gap:1rem; flex-wrap: wrap;">
        <button id="modalAddChildBtn">➕ Add Subtopic</button>
        <button id="modalDeleteBtn" class="mini-btn danger" style="display:none;">🗑 Delete</button>
        <button id="modalCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- STORAGE KEYS ----------
      const STORAGE_TREE = 'ssc_syllabus_tree';
      const STORAGE_MOCKS = 'ssc_mock_tests';

      // ---------- GLOBAL DATA ----------
      let syllabusTree = null;       // root node object
      let mockTests = [];            // array of mock objects

      // UI state for tree
      let expandedRootSubjectId = null;   // which top-level subject branch is open (focus mode)
      let showAll = false;                // override to show all root branches
      let nodeExpandedSet = new Set();    // ids of deeper nodes (depth>1) that are expanded

      // current selected node id for modal
      let currentModalNodeId = null;

      let dataMenuOpen = false;

      // ---------- DEFAULT SYLLABUS TREE ----------
      function createDefaultTree() {
        const root = {
          id: 'root',
          name: 'SSC Syllabus',
          confidence: 2,
          notes: '',
          tier2only: false,
          children: []
        };

        // English
        const eng = {
          id: 'eng',
          name: 'English Language',
          confidence: 2,
          notes: '',
          tier2only: false,
          children: [
            { id: 'eng1', name: 'Spot the Error', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng2', name: 'Fill in the Blanks', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng3', name: 'Synonyms / Homonyms', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng4', name: 'Antonyms', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng5', name: 'Spellings / Detecting mis-spelt words', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng6', name: 'Idioms & Phrases', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng7', name: 'One word substitution', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng8', name: 'Improvement of Sentences', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng9', name: 'Active / Passive Voice', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng10', name: 'Direct / Indirect narration', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng11', name: 'Shuffling of Sentence parts', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng12', name: 'Shuffling of Sentences in passage', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng13', name: 'Cloze Passage', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'eng14', name: 'Comprehension Passage', confidence:2, notes:'Tier 2: two paragraphs (story + current affairs)', tier2only:false, children:[] }
          ]
        };

        // Reasoning
        const reasoning = {
          id: 'reasoning',
          name: 'General Intelligence',
          confidence: 2,
          notes: '',
          tier2only: false,
          children: [
            { id: 'res1', name: 'Semantic Analogy', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res2', name: 'Symbolic operations', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res3', name: 'Symbolic/Number Analogy', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res4', name: 'Trends', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res5', name: 'Figural Analogy', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res6', name: 'Space Orientation', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res7', name: 'Semantic Classification', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res8', name: 'Venn Diagrams', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res9', name: 'Symbolic/Number Classification', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res10', name: 'Drawing inferences', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res11', name: 'Figural Classification', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res12', name: 'Punched hole/pattern-folding', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res13', name: 'Semantic Series', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res14', name: 'Figural Pattern-folding', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res15', name: 'Number Series', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res16', name: 'Embedded figures', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res17', name: 'Figural Series', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res18', name: 'Critical Thinking', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res19', name: 'Problem Solving', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'res20', name: 'Emotional Intelligence', confidence:2, notes:'', tier2only:false, children:[] },

        const quant = {

              { id: 'q1b', name: 'Relationship between numbers', confidence:2, notes:'', tier2only:false, children:[] }
            ]},
            { id: 'q2', name: 'Percentages', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q3', name: 'Ratio and Proportion', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q4', name: 'Square roots', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q5', name: 'Averages', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q6', name: 'Interest (Simple & Compound)', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q7', name: 'Profit and Loss', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q8', name: 'Discount', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q9', name: 'Partnership Business', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q10', name: 'Mixture and Alligation', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q11', name: 'Time and distance', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q12', name: 'Time and work', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'q13', name: 'Algebra', confidence:2, notes:'Basic identities, surds, linear graphs', tier2only:false, children:[] },
            { id: 'q14', name: 'Geometry', confidence:2, notes:'Triangles, circles, chords, tangents', tier2only:false, children:[] },
            { id: 'q15', name: 'Mensuration', confidence:2, notes:'2D/3D figures', tier2only:false, children:[] },
            { id: 'q16', name: 'Trigonometry', confidence:2, notes:'Ratios, heights & distances', tier2only:false, children:[] },
            { id: 'q17', name: 'Statistical Charts', confidence:2, notes:'Histogram, bar, pie', tier2only:false, children:[] },
            { id: 'q18', name: 'Statistics and Probability', confidence:2, notes:'Mean, median, mode, SD, simple probability (Tier 2 only)', tier2only: true, children:[] }
          ]
        };

        // General Awareness
        const ga = {
          id: 'ga',
          name: 'General Awareness',
          confidence: 2,
          notes: '',
          tier2only: false,
          children: [
            { id: 'ga1', name: 'History', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'ga2', name: 'Geography', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'ga3', name: 'Polity', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'ga4', name: 'Economics', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'ga5', name: 'General Science', confidence:2, notes:'', tier2only:false, children:[] },
            { id: 'ga6', name: 'Current Affairs', confidence:2, notes:'', tier2only:false, children:[] }

        };

        // Computer Knowledge (Tier 2 only)
        const comp = {
          id: 'comp',
          name: 'Computer Knowledge',
          confidence: 2,
          notes: '',
          tier2only: true,
          children: [
            { id: 'c1', name: 'Computer Basics', confidence:2, notes:'CPU, I/O, memory, ports', tier2only:true, children:[] },
            { id: 'c2', name: 'Software & OS', confidence:2, notes:'Windows, MS Office', tier2only:true, children:[] },
            { id: 'c3', name: 'Internet & E-mail', confidence:2, notes:'Browsing, e-banking', tier2only:true, children:[] },
            { id: 'c4', name: 'Networking & Cyber Security', confidence:2, notes:'Devices, threats, prevention', tier2only:true, children:[] }
          ]
        };

        root.children = [eng, reasoning, quant, ga, comp];
        return root;
      }

      // ---------- HELPER: FIND NODE BY ID ----------
      function findNodeById(node, id) {
        if (node.id === id) return node;
        for (let child of node.children || []) {
          const found = findNodeById(child, id);
          if (found) return found;
        }
        return null;
      }

      function findParentNodeById(node, targetId, parent = null) {
        if (node.id === targetId) return parent;
        for (let child of node.children || []) {
          const foundParent = findParentNodeById(child, targetId, node);
          if (foundParent) return foundParent;
        }
        return null;
      }

      // ---------- LOCAL STORAGE ----------
      function saveAllData() {
        localStorage.setItem(STORAGE_TREE, JSON.stringify(syllabusTree));
        localStorage.setItem(STORAGE_MOCKS, JSON.stringify(mockTests));
      }

      function loadAllData() {
        const treeData = localStorage.getItem(STORAGE_TREE);
        if (treeData) {
          try { syllabusTree = JSON.parse(treeData); } catch(e){ syllabusTree = createDefaultTree(); }
        } else {
          syllabusTree = createDefaultTree();
        }
        const mockData = localStorage.getItem(STORAGE_MOCKS);
        if (mockData) {
          try { mockTests = JSON.parse(mockData); } catch(e){ mockTests = []; }
        } else {
          mockTests = [];
        }
      }

      // ---------- RENDER SYLLABUS TREE ----------
      function renderTree() {
        const container = document.getElementById('tree-container');
        container.innerHTML = '';
        if (!syllabusTree || !syllabusTree.children) return;

        // render root children (subjects)
        syllabusTree.children.forEach(subjectNode => {
          const subjectEl = createNodeElement(subjectNode, 1); // depth 1 = subject level
          container.appendChild(subjectEl);
        });
      }

      function createNodeElement(node, depth) {
        const card = document.createElement('div');
        card.className = `node-card ${depth === 1 ? 'root-children' : ''} conf-${node.confidence || 2}`;
        card.dataset.nodeId = node.id;

        const header = document.createElement('div');
        header.className = 'node-header';

        // expand/collapse button (only if node has children)
        if (node.children && node.children.length > 0) {
          const expandBtn = document.createElement('button');
          expandBtn.className = 'expand-btn';
          const isExpanded = (depth === 1) ? (showAll || expandedRootSubjectId === node.id) : nodeExpandedSet.has(node.id);
          expandBtn.innerHTML = isExpanded ? '▼' : '▶';
          expandBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (depth === 1) {
              // top-level focus behavior
              if (showAll) {
                // if showing all, switch to focus mode on clicked
                showAll = false;
                expandedRootSubjectId = node.id;
              } else if (expandedRootSubjectId === node.id) {
                expandedRootSubjectId = null;
              } else {
                expandedRootSubjectId = node.id;
              }
            } else {
              // deeper nodes toggle locally
              if (nodeExpandedSet.has(node.id)) {
                nodeExpandedSet.delete(node.id);
              } else {
                nodeExpandedSet.add(node.id);
              }
            }
            renderTree();
          });
          header.appendChild(expandBtn);
        }

        const nameSpan = document.createElement('span');
        nameSpan.className = 'node-name';
        nameSpan.textContent = node.name;
        nameSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          openNodeModal(node.id);
        });
        header.appendChild(nameSpan);

        if (node.tier2only) {
          const badge = document.createElement('span');
          badge.className = 'tier2-badge';
          badge.textContent = 'T2';
          header.appendChild(badge);
        }

        if (depth > 1) {
          const actionWrap = document.createElement('div');
          actionWrap.className = 'node-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'mini-btn icon-only';
          editBtn.type = 'button';
          editBtn.title = 'Edit subtopic';
          editBtn.setAttribute('aria-label', 'Edit subtopic');
          editBtn.innerHTML = '<svg class="node-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm2.92 2.33H5v-.92l8.06-8.06.92.92L5.92 19.58ZM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82Z"/></svg>';
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openNodeModal(node.id);
          });
          actionWrap.appendChild(editBtn);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'mini-btn danger icon-only';
          deleteBtn.type = 'button';
          deleteBtn.title = 'Delete subtopic';
          deleteBtn.setAttribute('aria-label', 'Delete subtopic');
          deleteBtn.innerHTML = '<svg class="node-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 7h12l-1 14H7L6 7Zm3-3h6l1 2H8l1-2Zm-1 5h2v9H8V9Zm4 0h2v9h-2V9Zm4 0h2v9h-2V9Z"/></svg>';
          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeNode(node.id);
          });
          actionWrap.appendChild(deleteBtn);

          header.appendChild(actionWrap);
        }

        card.appendChild(header);

        // children container
        if (node.children && node.children.length > 0) {
          const childrenDiv = document.createElement('div');
          childrenDiv.className = 'node-children';
          const visible = (depth === 1) ? (showAll || expandedRootSubjectId === node.id) : nodeExpandedSet.has(node.id);
          childrenDiv.style.display = visible ? 'flex' : 'none';
          node.children.forEach(child => {
            childrenDiv.appendChild(createNodeElement(child, depth + 1));
          });
          card.appendChild(childrenDiv);
        }

        return card;
      }

      // ---------- MODAL LOGIC ----------
      function openNodeModal(nodeId) {
        const node = findNodeById(syllabusTree, nodeId);
        if (!node) return;
        currentModalNodeId = nodeId;
        document.getElementById('modalNodeName').textContent = node.name;
        document.getElementById('modalNotes').value = node.notes || '';
        const parentNode = findParentNodeById(syllabusTree, nodeId);
        document.getElementById('modalDeleteBtn').style.display = parentNode && parentNode.id !== 'root' ? 'inline-flex' : 'none';

        const palette = document.getElementById('confidencePalette');
        palette.innerHTML = '';
        const colors = ['#e03131', '#f08c00', '#ffd43b', '#82c91e', '#2f9e44'];
        const labels = ['Bad', 'Weak', 'Okay', 'Good', 'Great'];
        colors.forEach((color, idx) => {
          const dot = document.createElement('div');
          dot.className = 'conf-dot';
          dot.style.backgroundColor = color;
          dot.title = labels[idx];
          if (node.confidence === idx) dot.style.boxShadow = '0 0 0 3px #fff, 0 0 0 6px #6965db';
          dot.addEventListener('click', () => {
            node.confidence = idx;
            saveAllData();
            renderTree();
            openNodeModal(nodeId); // refresh modal palette
          });
          palette.appendChild(dot);
        });

        document.getElementById('nodeModal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('nodeModal').style.display = 'none';
        // save notes on close
        if (currentModalNodeId) {
          const node = findNodeById(syllabusTree, currentModalNodeId);
          if (node) {
            node.notes = document.getElementById('modalNotes').value;
            saveAllData();
            renderTree();
          }
        }
        currentModalNodeId = null;
      }

      function removeNode(nodeId) {
        const parentNode = findParentNodeById(syllabusTree, nodeId);
        if (!parentNode || parentNode.id === 'root') return;

        const labelNode = findNodeById(syllabusTree, nodeId);
        const label = labelNode ? labelNode.name : 'this item';
        const confirmed = window.confirm(`Delete ${label}? This cannot be undone.`);
        if (!confirmed) return;

        parentNode.children = (parentNode.children || []).filter(child => child.id !== nodeId);
        saveAllData();

        if (currentModalNodeId === nodeId) {
          closeModal();
        }

        renderTree();
      }

      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('modalDeleteBtn').addEventListener('click', () => {
        if (currentModalNodeId) removeNode(currentModalNodeId);
      });
      document.getElementById('nodeModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });

      document.getElementById('modalAddChildBtn').addEventListener('click', () => {
        if (!currentModalNodeId) return;
        const parentNode = findNodeById(syllabusTree, currentModalNodeId);
        if (!parentNode) return;
        const name = prompt('Enter new subtopic name:');
        if (!name || !name.trim()) return;
        const newChild = {
          id: 'node_' + Date.now() + Math.random().toString(36),
          name: name.trim(),
          confidence: 2,
          notes: '',
          tier2only: false,
          children: []
        };
        if (!parentNode.children) parentNode.children = [];
        parentNode.children.push(newChild);
        saveAllData();
        renderTree();
        openNodeModal(currentModalNodeId); // refresh modal
      });

      // ---------- MOCK TEST LOGIC ----------
      function getSubjectFieldsForTier(tier) {
        if (tier == 2) {
          return ['English', 'Quant', 'Reasoning', 'GA', 'Computer'];
        } else {
          return ['English', 'Quant', 'Reasoning', 'GA'];
        }
      }

      function renderSubjectInputs() {
        const tier = document.getElementById('mockTier').value;
        const subjects = getSubjectFieldsForTier(tier);
        const container = document.getElementById('subjectMarksContainer');
        container.innerHTML = '';
        subjects.forEach(sub => {
          const div = document.createElement('div');
          div.innerHTML = `<label>${sub}</label><input type="number" class="subject-mark" data-subject="${sub}" value="0" min="0">`;
          container.appendChild(div);
        });
      }

      document.getElementById('mockTier').addEventListener('change', renderSubjectInputs);

      function addMockTest() {
        const tier = parseInt(document.getElementById('mockTier').value);
        const examLevel = document.getElementById('mockExam').value;
        const source = document.getElementById('mockSource').value.trim();
        const date = document.getElementById('mockDate').value;
        const totalMax = parseInt(document.getElementById('mockTotalMax').value) || 0;
        const totalObt = parseInt(document.getElementById('mockTotalObt').value) || 0;

        if (!source || !date) {
          alert('Please fill source and date.');
          return;
        }

        const subjectInputs = document.querySelectorAll('.subject-mark');
        const subjectMarks = {};
        subjectInputs.forEach(inp => {
          subjectMarks[inp.dataset.subject] = parseInt(inp.value) || 0;
        });

        const newMock = {
          id: Date.now(),
          tier,
          examLevel,
          source,
          date,
          totalMax,
          totalObt,
          subjectMarks
        };
        mockTests.push(newMock);
        saveAllData();
        renderMockList();
        clearMockForm();
      }

      function clearMockForm() {
        document.getElementById('mockSource').value = '';
        document.getElementById('mockDate').value = '';
        document.getElementById('mockTotalMax').value = '200';
        document.getElementById('mockTotalObt').value = '0';
        renderSubjectInputs();
      }

      function deleteMock(id) {
        mockTests = mockTests.filter(m => m.id !== id);
        saveAllData();
        renderMockList();
      }

      function renderMockList() {
        const container = document.getElementById('mockListContainer');
        if (mockTests.length === 0) {
          container.innerHTML = '<p>No mock tests recorded yet.</p>';
          return;
        }
        const sorted = [...mockTests].sort((a,b) => new Date(b.date) - new Date(a.date));
        let html = `<table class="mock-table"><thead><tr><th>Date</th><th>Tier</th><th>Exam</th><th>Source</th><th>Total</th>`;
        const sampleSubs = sorted[0].subjectMarks ? Object.keys(sorted[0].subjectMarks) : [];
        sampleSubs.forEach(s => html += `<th>${s}</th>`);
        html += `<th>Action</th></tr></thead><tbody>`;
        sorted.forEach(m => {
          html += `<tr>
            <td>${m.date}</td>
            <td>${m.tier}</td>
            <td>${m.examLevel}</td>
            <td>${m.source}</td>
            <td>${m.totalObt}/${m.totalMax}</td>`;
          sampleSubs.forEach(s => {
            html += `<td>${m.subjectMarks?.[s] ?? '-'}</td>`;
          });
          html += `<td><button class="btn-small" onclick="deleteMock(${m.id})">❌</button></td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      }
      window.deleteMock = deleteMock; // expose for inline onclick

      document.getElementById('addMockBtn').addEventListener('click', addMockTest);

      // ---------- ANALYTICS ----------
      let totalChartInstance = null;
      let subjectChartInstance = null;

      function refreshAnalytics() {
        const tier = parseInt(document.getElementById('analyticTier').value);
        const checkedExams = Array.from(document.querySelectorAll('.exam-check:checked')).map(cb => cb.value);
        const filtered = mockTests.filter(m => m.tier === tier && checkedExams.includes(m.examLevel));
        const sorted = [...filtered].sort((a,b) => new Date(a.date) - new Date(b.date));

        // stats
        const statsDiv = document.getElementById('statsContainer');
        if (sorted.length === 0) {
          statsDiv.innerHTML = '<p>No data for selected filters.</p>';
        } else {
          const topTotal = Math.max(...sorted.map(m => m.totalObt));
          const avgTotal = (sorted.reduce((s,m) => s + m.totalObt, 0) / sorted.length).toFixed(1);
          let subStats = '';
          const allSubs = sorted[0].subjectMarks ? Object.keys(sorted[0].subjectMarks) : [];
          allSubs.forEach(sub => {
            const topSub = Math.max(...sorted.map(m => m.subjectMarks?.[sub] || 0));
            subStats += `<strong>${sub}:</strong> Top ${topSub} | `;
          });
          statsDiv.innerHTML = `<p>🏆 <strong>Top Total Score:</strong> ${topTotal} | 📊 <strong>Average:</strong> ${avgTotal}</p><p>${subStats}</p>`;
        }

        // total score chart
        const ctxTotal = document.getElementById('totalScoreChart').getContext('2d');
        if (totalChartInstance) totalChartInstance.destroy();
        totalChartInstance = new Chart(ctxTotal, {
          type: 'line',
          data: {
            labels: sorted.map(m => m.date),
            datasets: [{
              label: 'Total Obtained Marks',
              data: sorted.map(m => m.totalObt),
              borderColor: '#6965db',
              backgroundColor: 'rgba(105,101,219,0.15)',
              borderWidth: 3,
              pointBackgroundColor: '#000',
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { labels: { font: { family: 'JetBrains Mono', size: 14 } } }
            },
            scales: {
              x: { ticks: { font: { family: 'JetBrains Mono' } } },
              y: { beginAtZero: true, ticks: { font: { family: 'JetBrains Mono' } } }
            }
          }
        });

        // subject-wise chart
        const ctxSub = document.getElementById('subjectScoreChart').getContext('2d');
        if (subjectChartInstance) subjectChartInstance.destroy();
        if (sorted.length > 0 && sorted[0].subjectMarks) {
          const subjects = Object.keys(sorted[0].subjectMarks);
          const datasets = subjects.map((sub, i) => {
            const colors = ['#e03131','#1c7ed6','#f08c00','#2f9e44','#6965db'];
            return {
              label: sub,
              data: sorted.map(m => m.subjectMarks?.[sub] || 0),
              borderColor: colors[i % colors.length],
              backgroundColor: 'transparent',
              borderWidth: 3,
              tension: 0.2
            };
          });
          subjectChartInstance = new Chart(ctxSub, {
            type: 'line',
            data: { labels: sorted.map(m => m.date), datasets },
            options: {
              responsive: true,
              plugins: { legend: { labels: { font: { family: 'JetBrains Mono' } } } },
              scales: {
                x: { ticks: { font: { family: 'JetBrains Mono' } } },
                y: { beginAtZero: true, ticks: { font: { family: 'JetBrains Mono' } } }
              }
            }
          });
        }
      }

      document.getElementById('refreshAnalyticsBtn').addEventListener('click', refreshAnalytics);

      // ---------- TAB SWITCHING ----------
      const tabBtns = document.querySelectorAll('.tab-btn');
      const syllabusPage = document.getElementById('syllabus-page');
      const mockPage = document.getElementById('mock-page');

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          if (tab === 'syllabus') {
            syllabusPage.style.display = 'block';
            mockPage.classList.add('hidden-page');
          } else {
            syllabusPage.style.display = 'none';
            mockPage.classList.remove('hidden-page');
            renderMockList();
          }
        });
      });

      // ---------- SHOW ALL BUTTON ----------
      document.getElementById('showAllBtn').addEventListener('click', () => {
        showAll = !showAll;
        if (showAll) {
          expandedRootSubjectId = null;
        }
        document.getElementById('showAllBtn').textContent = showAll ? '🔽 Collapse All' : '👁️ Show All Subjects';
        renderTree();
      });

      // ---------- DATA POPUP ----------
      const dataMenuBtn = document.getElementById('dataMenuBtn');
      const dataMenu = document.getElementById('dataMenu');

      function closeDataMenu() {
        dataMenuOpen = false;
        dataMenu.classList.remove('open');
      }

      function toggleDataMenu() {
        dataMenuOpen = !dataMenuOpen;
        dataMenu.classList.toggle('open', dataMenuOpen);
      }

      dataMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDataMenu();
      });

      document.addEventListener('click', (e) => {
        if (!dataMenu.contains(e.target) && e.target !== dataMenuBtn) {
          closeDataMenu();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (document.getElementById('nodeModal').style.display === 'flex') {
            closeModal();
            return;
          }
          if (dataMenuOpen) {
            closeDataMenu();
          }
        }
      });

      // ---------- EXPORT / IMPORT ----------
      document.getElementById('exportAllBtn').addEventListener('click', () => {
        closeDataMenu();
        const data = { syllabusTree, mockTests };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ssc_prep_backup.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('importAllBtn').addEventListener('click', () => {
        closeDataMenu();
        document.getElementById('importFileInput').click();
      });

      document.getElementById('importFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.syllabusTree && data.mockTests) {
              syllabusTree = data.syllabusTree;
              mockTests = data.mockTests;
              saveAllData();
              renderTree();
              renderMockList();
              alert('Data imported successfully!');
            } else {
              alert('Invalid file format.');
            }
          } catch (ex) {
            alert('Error parsing JSON.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // ---------- INITIALIZATION ----------
      loadAllData();
      renderTree();
      renderSubjectInputs();
      document.getElementById('mockDate').value = new Date().toISOString().slice(0,10);
      // Default tab is syllabus
      syllabusPage.style.display = 'block';
      mockPage.classList.add('hidden-page');

      closeDataMenu();
    })();
